name: 매일 입찰 확인

on:
  schedule:
    - cron: "0 0 * * *"      # 매일 00:00 UTC = 한국시간 오전 9시
  workflow_dispatch:          # Actions 화면에서 수동 실행 버튼
  push:                       # PC가 확인 결과(data/)를 올리면 웹페이지만 다시 만듦
    branches: [main]
    paths: ["data/**"]

permissions:
  contents: write             # data/ 폴더 결과 저장
  pages: write
  id-token: write

concurrency:
  group: daily-bid
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 설치
        run: |
          pip install -r requirements.txt
          if [ "${{ github.event_name }}" != "push" ]; then
            python -m playwright install --with-deps chromium
          fi

      - name: 입찰 확인 (PC 결과가 올라온 경우엔 웹페이지만)
        env:
          BID_DATA_DIR: data
          TZ: Asia/Seoul
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python 입찰알림.py --html-only
          else
            python 입찰알림.py
          fi

      - name: 결과 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/found.json data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "서버 확인 결과 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              sleep 15
            done
          fi

      - name: 웹페이지 준비 (PAGE_PASSWORD 비밀값이 있으면 비밀번호로 잠금)
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          mkdir -p _site
          if [ -n "$PAGE_PASSWORD" ]; then
            pip install -q cryptography
            python encrypt_page.py "data/입찰현황.html" _site/index.html
          else
            cp "data/입찰현황.html" _site/index.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 업로드 반영 대기 (바로 배포하면 GitHub이 파일을 못 찾는 경우가 있음)
        run: sleep 20

      - id: deploy
        uses: actions/deploy-pages@v4

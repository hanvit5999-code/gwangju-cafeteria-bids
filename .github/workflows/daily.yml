name: 매일 입찰 확인

on:
  schedule:
    - cron: "0 0 * * *"      # 매일 00:00 UTC = 한국시간 오전 9시
  workflow_dispatch:          # Actions 화면에서 수동 실행 버튼

permissions:
  contents: write             # data/ 폴더 결과 저장
  pages: write
  id-token: write

concurrency:
  group: daily-bid
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk >/dev/null

      - name: 입찰 확인
        env:
          BID_DATA_DIR: data
          TZ: Asia/Seoul
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python 입찰알림.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/found.json data/state.json
          git diff --cached --quiet || git commit -m "입찰 결과 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push

      - name: 웹페이지 준비
        run: |
          mkdir -p _site
          cp "data/입찰현황.html" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
